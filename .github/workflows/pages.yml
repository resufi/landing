name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Позволяет запустить вручную из вкладки Actions, не делая коммит.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Одновременно идёт только одна публикация. Незавершённые не отменяем:
# оборванный деплой Pages оставляет сайт в промежуточном состоянии.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Те же проверки, что и локально. Публиковать неработающее хуже,
      # чем не публиковать вовсе.
      - run: npm run typecheck
      - run: npm run lint

      - name: Build
        env:
          # Pages раздаёт сайт по пути /<репозиторий>/, а не из корня домена.
          # Без префикса все ссылки на скрипты и стили ведут в корень, и
          # страница открывается пустой.
          BASE_PATH: /${{ github.event.repository.name }}
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
