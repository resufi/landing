name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run typecheck
      - run: npm run lint

      - name: Build
        env:
          BASE_PATH: /${{ github.event.repository.name }}
          # Необязательный. Без него toncenter отдаёт примерно запрос в
          # секунду, и сборка ждёт лишние секунды; с ним — сразу. Пустой
          # секрет безопасен: цифры прочитаются и так.
          # В бандл не попадает — читается только на сборке.
          TONCENTER_API_KEY: ${{ secrets.TONCENTER_API_KEY }}
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
